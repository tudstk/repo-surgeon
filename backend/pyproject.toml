[project]
name = "repo-surgeon-api"
version = "0.1.0"
description = "Repo Surgeon's typed HTTP API."
requires-python = ">=3.14,<3.15"
dependencies = [
  "alembic==1.19.2",
  "asyncpg==0.31.0",
  "fastapi==0.141.1",
  "pydantic-settings==2.15.0",
  "sqlalchemy[asyncio]==2.0.52",
  "uvicorn[standard]==0.52.4",
]

[dependency-groups]
dev = [
  "aiosqlite==0.22.1",
  "httpx==0.28.1",
  "mypy==2.3.1",
  "pytest==9.1.1",
  "ruff==0.16.6",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_surgeon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
show_error_codes = true
pretty = true
